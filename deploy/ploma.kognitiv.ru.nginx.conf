server {
    listen 80;
    listen [::]:80;
    server_name ploma.kognitiv.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://ploma.kognitiv.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ploma.kognitiv.ru;

    ssl_certificate /etc/letsencrypt/live/ploma.kognitiv.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ploma.kognitiv.ru/privkey.pem;

    auth_basic "Ploma private";
    auth_basic_user_file /etc/nginx/ploma.htpasswd;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:3000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 150s;
    }
}
