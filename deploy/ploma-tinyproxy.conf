User tinyproxy
Group tinyproxy
Port 18888
Listen 10.203.0.2
StartServers 2
MinSpareServers 1
MaxSpareServers 4
MaxRequestsPerChild 0
Timeout 300
MaxClients 20
LogLevel Warning
LogFile "/var/log/tinyproxy/ploma-vpn.log"
PidFile "/run/ploma-vpn-proxy/tinyproxy.pid"
Allow 10.203.0.1
ConnectPort 443
DisableViaHeader Yes
